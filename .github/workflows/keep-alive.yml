name: Keep Server Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # Every 14 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          curl -s --max-time 60 --retry 3 --retry-delay 10 \
            "https://justinsaphier-investment-tracker.onrender.com/api/ping" \
            && echo "✓ Server is alive" || echo "⚠ Ping timed out (server may be waking up)"
