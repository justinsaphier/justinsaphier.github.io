name: Daily Portfolio Email

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 8:00 AM EDT (UTC-4) Monday–Friday
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Wake server and send daily emails
        run: |
          echo "Triggering daily portfolio emails at $(date)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://justinsaphier-investment-tracker.onrender.com/api/cron-emails" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60 --retry 2 --retry-delay 15)
          BODY=$(echo "$RESPONSE" | head -n1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "Status: $STATUS"
          echo "Response: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Email job failed with status $STATUS"
            exit 1
          fi
